[package]
name = "xrpl_rust_client"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A Rust library for interacting with the XRP Ledger (XRPL)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/xrpl-rust-client"
readme = "README.md"
keywords = ["xrpl", "ripple", "blockchain", "cryptocurrency"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }
reqwest = { version = "0.12.23", features = ["json", "native-tls"] }
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
ripemd = "0.1.3"
secp256k1 = { version = "0.31.1", features = ["rand"] }
ed25519-dalek = "2.1"
bs58 = "0.5.1"
hex = "0.4.3"
rand = "0.9.2"
anyhow = "1.0.99"
thiserror = "2.0.16"
base64 = "0.22.1"
log = "0.4.28"
env_logger = "0.11"
rust_decimal = "1.35.0"
rust_decimal_macros = "1.35.0"

[dev-dependencies]
tokio-test = "0.4.4"

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
missing_docs = "deny"
unused_results = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
# Set groups to lower priority so individual lints can override
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Override specific lints
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
unused_self = "allow"

# Allow cargo lints that are too strict for development
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# Critical for library code
panic = "deny"
unwrap_used = "deny"
print_stdout = "deny"
dbg_macro = "deny"
todo = "deny"

[lib]
name = "xrpl_rust_client"
path = "src/lib.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "send_token_example"
path = "examples/send_token_example.rs"
