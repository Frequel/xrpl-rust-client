[package]
name = "xrpl_rust_client"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A Rust library for interacting with the XRP Ledger (XRPL)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/xrpl_rust_client"
readme = "README.md" # Assuming you will create a README.md
keywords = ["xrpl", "xrp", "blockchain", "crypto", "finance"]
categories = ["cryptography", "api-bindings"]

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }
reqwest = { version = "0.12.23", features = ["json", "native-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
ripemd = "0.1.3"
secp256k1 = { version = "0.31.1", features = ["rand"] }
# base58 = "0.2"
bs58 = "0.5.1"
hex = "0.4.3"
rand = "0.9.2"
anyhow = "1.0.99"
thiserror = "2.0.16"
base64 = "0.22.1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tokio-test = "0.4.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_results = "deny"
missing_debug_implementations = "warn"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Override overly strict pedantic lints
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow" # Allow for pragmatic dependency management
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"

# Critical for library code
panic = "deny"
unwrap_used = "deny"
expect_used = "allow"
print_stdout = "deny"
dbg_macro = "deny"
todo = "deny"
